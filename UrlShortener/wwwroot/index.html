<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f5f6f8;
            color: #1f2328;
            line-height: 1.5;
        }

        main {
            max-width: 720px;
            margin: 48px auto;
            padding: 0 16px;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #656d76;
        }

        .card {
            background: #ffffff;
            border: 1px solid #d8dee4;
            border-radius: 8px;
            padding: 24px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .optional {
            font-weight: 400;
            color: #656d76;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            background: #ffffff;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
        }

        .field {
            margin-bottom: 16px;
        }

        .row {
            display: flex;
            gap: 16px;
        }

        .row .field {
            flex: 1;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #0969da;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #0757b5;
        }

        button:disabled {
            background: #8c959f;
            cursor: default;
        }

        button.secondary {
            padding: 6px 14px;
            font-size: 14px;
            background: #ffffff;
            color: #1f2328;
            border: 1px solid #d0d7de;
        }

        button.secondary:hover {
            background: #f3f4f6;
        }

        .error {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 6px;
            background: #fff1f0;
            border: 1px solid #ffc9c4;
            color: #b42318;
            font-size: 14px;
        }

        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 6px;
            background: #eef6ff;
            border: 1px solid #b6d4fe;
        }

        .result-label {
            margin: 0 0 8px;
            font-size: 14px;
            color: #656d76;
        }

        .result-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .result a {
            color: #0969da;
            font-weight: 600;
            word-break: break-all;
        }

        .result-meta {
            margin: 8px 0 0;
            font-size: 13px;
            color: #656d76;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 560px) {
            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>URL Shortener</h1>
    <p class="subtitle">Turn long links into short ones.</p>

    <section class="card">
        <form id="create-form">
            <div class="field">
                <label for="url">Long URL</label>
                <input id="url" name="url" type="url" placeholder="https://example.com/some/long/path" required>
            </div>

            <div class="row">
                <div class="field">
                    <label for="alias">Custom alias <span class="optional">(optional)</span></label>
                    <input id="alias" name="alias" type="text" placeholder="my-link" maxlength="32">
                </div>

                <div class="field">
                    <label for="expires">Expires</label>
                    <select id="expires" name="expires">
                        <option value="">Never</option>
                        <option value="1">After 1 day</option>
                        <option value="7">After 7 days</option>
                        <option value="30">After 30 days</option>
                        <option value="90">After 90 days</option>
                        <option value="365">After 1 year</option>
                    </select>
                </div>
            </div>

            <button id="submit-button" type="submit">Shorten</button>
        </form>

        <div id="error" class="error hidden" role="alert"></div>

        <div id="result" class="result hidden">
            <p class="result-label">Your short link</p>
            <div class="result-row">
                <a id="short-url" href="#" target="_blank" rel="noopener"></a>
                <button id="copy-button" class="secondary" type="button">Copy</button>
            </div>
            <p id="result-meta" class="result-meta"></p>
        </div>
    </section>
</main>

<script>
    const form = document.getElementById("create-form");
    const submitButton = document.getElementById("submit-button");
    const errorBox = document.getElementById("error");
    const result = document.getElementById("result");
    const shortUrlLink = document.getElementById("short-url");
    const resultMeta = document.getElementById("result-meta");
    const copyButton = document.getElementById("copy-button");

    function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.remove("hidden");
    }

    function hideError() {
        errorBox.textContent = "";
        errorBox.classList.add("hidden");
    }

    // Read the API's { "error": "..." } message, or fall back to a generic one
    async function readError(response) {
        try {
            const data = await response.json();
            if (data && data.error) {
                return data.error;
            }
        } catch {
            // Response body was empty or not JSON
        }
        return `Request failed (${response.status}).`;
    }

    function formatDate(value) {
        return new Date(value).toLocaleString();
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const expires = document.getElementById("expires").value;
        const body = {
            url: document.getElementById("url").value.trim(),
            alias: document.getElementById("alias").value.trim(),
            expiresInDays: expires ? Number(expires) : null
        };

        submitButton.disabled = true;
        hideError();
        result.classList.add("hidden");

        try {
            const response = await fetch("/api/links", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                showError(await readError(response));
                return;
            }

            const link = await response.json();
            shortUrlLink.href = link.shortUrl;
            shortUrlLink.textContent = link.shortUrl;
            resultMeta.textContent = link.expiresAt
                ? `Expires ${formatDate(link.expiresAt)}`
                : "Never expires";
            copyButton.textContent = "Copy";
            result.classList.remove("hidden");
            form.reset();
        } catch {
            showError("Could not reach the server. Is it running?");
        } finally {
            submitButton.disabled = false;
        }
    });

    copyButton.addEventListener("click", async () => {
        const text = shortUrlLink.textContent;

        try {
            await navigator.clipboard.writeText(text);
        } catch {
            // Fallback for browsers that block the clipboard API
            const temp = document.createElement("textarea");
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            temp.remove();
        }

        copyButton.textContent = "Copied";
        setTimeout(() => (copyButton.textContent = "Copy"), 1500);
    });
</script>
</body>
</html>
