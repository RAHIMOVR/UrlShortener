<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f5f6f8;
            color: #1f2328;
            line-height: 1.5;
        }

        main {
            max-width: 720px;
            margin: 48px auto;
            padding: 0 16px;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #656d76;
        }

        .card {
            background: #ffffff;
            border: 1px solid #d8dee4;
            border-radius: 8px;
            padding: 24px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .optional {
            font-weight: 400;
            color: #656d76;
        }

        input,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            background: #ffffff;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
        }

        .field {
            margin-bottom: 16px;
        }

        .row {
            display: flex;
            gap: 16px;
        }

        .row .field {
            flex: 1;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #0969da;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #0757b5;
        }

        button:disabled {
            background: #8c959f;
            cursor: default;
        }

        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 6px;
            background: #eef6ff;
            border: 1px solid #b6d4fe;
        }

        .result a {
            color: #0969da;
            font-weight: 600;
            word-break: break-all;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 560px) {
            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>URL Shortener</h1>
    <p class="subtitle">Turn long links into short ones.</p>

    <section class="card">
        <form id="create-form">
            <div class="field">
                <label for="url">Long URL</label>
                <input id="url" name="url" type="url" placeholder="https://example.com/some/long/path" required>
            </div>

            <div class="row">
                <div class="field">
                    <label for="alias">Custom alias <span class="optional">(optional)</span></label>
                    <input id="alias" name="alias" type="text" placeholder="my-link" maxlength="32">
                </div>

                <div class="field">
                    <label for="expires">Expires</label>
                    <select id="expires" name="expires">
                        <option value="">Never</option>
                        <option value="1">After 1 day</option>
                        <option value="7">After 7 days</option>
                        <option value="30">After 30 days</option>
                        <option value="90">After 90 days</option>
                        <option value="365">After 1 year</option>
                    </select>
                </div>
            </div>

            <button id="submit-button" type="submit">Shorten</button>
        </form>

        <div id="result" class="result hidden">
            Your short link:
            <a id="short-url" href="#" target="_blank" rel="noopener"></a>
        </div>
    </section>
</main>

<script>
    const form = document.getElementById("create-form");
    const submitButton = document.getElementById("submit-button");
    const result = document.getElementById("result");
    const shortUrlLink = document.getElementById("short-url");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const expires = document.getElementById("expires").value;
        const body = {
            url: document.getElementById("url").value.trim(),
            alias: document.getElementById("alias").value.trim(),
            expiresInDays: expires ? Number(expires) : null
        };

        submitButton.disabled = true;
        result.classList.add("hidden");

        try {
            const response = await fetch("/api/links", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                alert("Could not create the link.");
                return;
            }

            const link = await response.json();
            shortUrlLink.href = link.shortUrl;
            shortUrlLink.textContent = link.shortUrl;
            result.classList.remove("hidden");
            form.reset();
        } catch {
            alert("Could not reach the server.");
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
